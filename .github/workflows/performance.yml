name: Performance budgets

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: performance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos-reference-measurement:
    name: Declared macOS VM reference measurement
    runs-on: [self-hosted, macOS, ARM64, excalidraw-perf]
    # 15 minute edit soak (ADR-006) + warm-up/baseline/quiescent windows + build margin.
    timeout-minutes: 45
    env:
      CI: "true"
      PERF_TEST: "1"
      PERF_REFERENCE_RUN: "1"
      PERF_EXECUTION_ENVIRONMENT: virtual
      PERF_HOST_HARDWARE: ${{ vars.PERF_HOST_HARDWARE }}
      PERF_VIRTUALIZATION_NAME: Parallels Desktop Pro
      PERF_VIRTUALIZATION_VERSION: ${{ vars.PERF_VIRTUALIZATION_VERSION }}
      VITE_E2E_HARNESS: "1"
      PERF_STARTUP_REPORT_PATH: e2e/perf/results/startup-idle.json
      PERF_CANVAS_REPORT_PATH: e2e/perf/results/canvas-io.json
      PERF_SOAK_REPORT_PATH: e2e/perf/results/edit-soak.json

    steps:
      - name: Check out the measured commit
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Build the isolated Tauri measurement binary
        run: pnpm tauri build --features e2e-harness

      - name: Record declared reference-environment performance evidence
        run: >-
          pnpm exec playwright test
          --config=e2e/playwright.config.ts
          --project=browser-ui
          --retries=0
          e2e/perf/startup-idle.spec.ts
          e2e/perf/canvas-io.spec.ts
          e2e/perf/edit-soak.spec.ts

      - name: Require complete evaluated reports
        if: always()
        run: |
          node --input-type=module -e '
            import fs from "node:fs";
            const paths = [
              process.env.PERF_STARTUP_REPORT_PATH,
              process.env.PERF_CANVAS_REPORT_PATH,
              process.env.PERF_SOAK_REPORT_PATH,
            ];
            for (const path of paths) {
              if (!path || !fs.existsSync(path)) {
                throw new Error(`Missing performance report: ${path ?? "undefined"}`);
              }
              const report = JSON.parse(fs.readFileSync(path, "utf8"));
              if (report.schemaVersion !== "2.0.0") {
                throw new Error(`Unexpected report schema in ${path}`);
              }
              if (report.commit !== process.env.GITHUB_SHA) {
                throw new Error(`Report commit does not match GITHUB_SHA in ${path}`);
              }
              if (report.executionEnvironment?.type !== "virtual") {
                throw new Error(`Report does not identify a virtual reference environment in ${path}`);
              }
              if (report.executionEnvironment?.hostHardware !== "Apple M5 Pro / 48GB" ||
                  report.executionEnvironment.virtualization?.name !== "Parallels Desktop Pro" ||
                  report.executionEnvironment.virtualization?.version !== "26.4.1") {
                throw new Error(`Report does not match the first declared reference series in ${path}`);
              }
              if (!["pass", "fail"].includes(report.verdict?.overall)) {
                throw new Error(
                  `${path} requires an evaluated pass/fail verdict; received ${report.verdict?.overall ?? "missing"}`,
                );
              }
            }
          '

      - name: Archive machine-readable performance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: performance-macos-vm-reference-${{ github.run_id }}
          path: |
            e2e/perf/results/*.json
            e2e/playwright-report/
            e2e/test-results/
          if-no-files-found: warn
          retention-days: 30
