name: Release bundles

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos-universal:
    name: macOS Universal Binary
    # Signing and notarization are deliberately out of scope for the current
    # version (SC-010); the pipeline assembles the unsigned universal bundle.
    runs-on: macos-14
    steps:
      - name: Check out the tagged source
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install locked frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Add macOS toolchain targets for the universal build
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Build the universal application bundle
        run: pnpm tauri build --target universal-apple-darwin

      - name: Upload macOS bundles
        uses: actions/upload-artifact@v4
        with:
          name: excalidraw-desktop-macos-universal
          path: |
            src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
            src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app
            src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app.tar.gz
          if-no-files-found: error
          retention-days: 30

  linux-bundles:
    name: Linux AppImage / deb / rpm
    runs-on: ubuntu-22.04
    steps:
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            rpm

      - name: Check out the tagged source
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install locked frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Linux packages
        run: pnpm tauri build --bundles deb,rpm,appimage

      - name: Upload Linux bundles
        uses: actions/upload-artifact@v4
        with:
          name: excalidraw-desktop-linux
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm
            src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error
          retention-days: 30
