name: Cut release tag

# GITHUB_TOKEN tag pushes do not start other workflows, so this job creates
# the tag and then calls release.yml instead of relying on the tag push trigger.
# A human `git push origin v*` still uses release.yml's tag trigger directly.

on:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: cut-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  cut:
    name: Tag a new package version
    runs-on: ubuntu-22.04
    outputs:
      tag: ${{ steps.decide.outputs.tag }}
      should_release: ${{ steps.decide.outputs.should_release }}
    steps:
      - name: Check out main
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Decide whether this push needs a tag
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="$(python3 scripts/release-version.py)"
          tag="v${version}"
          if git ls-remote --exit-code --tags origin "refs/tags/${tag}" >/dev/null 2>&1; then
            echo "Tag ${tag} already exists; not cutting a release."
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            echo "tag=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Cutting annotated tag ${tag} from ${GITHUB_SHA}."
          echo "should_release=true" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

      - name: Create and push the annotated tag
        if: steps.decide.outputs.should_release == 'true'
        env:
          TAG: ${{ steps.decide.outputs.tag }}
        run: |
          set -euo pipefail
          git -c user.name='github-actions[bot]' \
            -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            tag -a "$TAG" -m "$TAG"
          git push origin "$TAG"

  release:
    name: Build and publish
    needs: cut
    if: needs.cut.outputs.should_release == 'true'
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.cut.outputs.tag }}
    permissions:
      contents: write
