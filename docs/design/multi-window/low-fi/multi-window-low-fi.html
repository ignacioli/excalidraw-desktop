<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Multi-window Low-fi</title>
<style>
@font-face{font-family:"HandLowFi";src:url("../../../../public/fonts/Virgil-CJK.woff2") format("woff2");font-display:swap}
:root{
  --bg:#f4f4f3;--surface:#fbfbfa;--panel:#fff;--ink:#20201f;--muted:#6e6d69;--line:#c8c8c4;--strong:#969691;--focus:#6f3fb5;
  --canvas:#ffffff;--grid:#ececea;--scrim:rgba(0,0,0,.18);
  --font:ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;--mono:ui-monospace,SFMono-Regular,Menlo,monospace;
  --hand:"HandLowFi","Comic Sans MS",cursive;
}
.dark{--bg:#232323;--surface:#2c2c2b;--panel:#262625;--ink:#ececea;--muted:#a9a9a4;--line:#4c4c48;--strong:#7d7d77;--canvas:#121212;--grid:#1e1e1e;--scrim:rgba(0,0,0,.45)}
*{box-sizing:border-box}
html,body{margin:0;background:#dcdcd8;color:#20201f;font:13px/1.45 var(--font)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.page{display:grid;grid-template-columns:300px 1fr;gap:16px;padding:16px;align-items:start}
.nav{position:sticky;top:16px;background:#fff;border:1px solid #c8c8c4;padding:12px;max-height:calc(100vh - 32px);overflow:auto}
.nav h1{font-size:15px;margin:0 0 4px}.nav p{margin:0 0 10px;color:#6e6d69;font-size:11px}
.nav h2{font:10px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:#6e6d69;margin:12px 0 4px}
.nav button{display:block;width:100%;text-align:left;border:1px solid #e0e0dc;background:#fbfbfa;padding:6px 8px;margin:3px 0;font-size:12px}
.nav button[aria-pressed=true]{background:#20201f;color:#fff;border-color:#20201f}
.note{margin-top:12px;border-top:1px dashed #969691;padding-top:10px;font-size:11px;color:#4f4e4b}
.note strong{color:#20201f}.note code{font-family:var(--mono)}
/* window frame */
.win{width:1280px;height:760px;background:var(--bg);color:var(--ink);border:1px solid #9a9a95;border-radius:10px;overflow:hidden;position:relative;display:grid;grid-template-rows:28px 1fr;box-shadow:0 10px 30px rgba(0,0,0,.18)}
.titlebar{display:flex;align-items:center;justify-content:center;position:relative;background:#e6e6e3;border-bottom:1px solid #c8c8c4;color:#20201f;font-size:13px;font-weight:600}
.dark .titlebar{background:#2f2f2e;color:#e6e6e3;border-color:#444}
.lights{position:absolute;left:10px;display:flex;gap:8px}.lights i{width:12px;height:12px;border-radius:50%;border:1px solid #8a8a85;background:#d8d8d4}
.titlebar .os{position:absolute;right:10px;font:10px var(--mono);font-weight:400;color:#8a8984}
.body{display:grid;grid-template-columns:auto 1fr;min-height:0;position:relative}
.sidebar{width:300px;border-right:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column;min-height:0}
.sidebar[hidden]{display:none}
.side-head{display:flex;gap:6px;align-items:center;padding:8px;border-bottom:1px solid var(--line)}
.side-head .ws{font-weight:650;flex:1}
.icon{width:30px;height:30px;border:1px solid var(--line);background:var(--surface);border-radius:6px;display:grid;place-items:center;font-size:13px}
.tree{padding:4px 0;overflow:auto}
.row{display:flex;align-items:center;gap:6px;height:28px;padding:0 8px 0 calc(8px + var(--d,0)*16px);position:relative}
.row .name{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .kebab{opacity:0;width:24px;height:24px;border:0;background:transparent;border-radius:4px}
.row:hover .kebab,.row.open .kebab{opacity:1}
.row.open{background:var(--grid)}.row.open .kebab{background:var(--line)}
.row.located{background:var(--grid);box-shadow:inset 3px 0 0 var(--ink)}
.main{display:grid;grid-template-rows:auto 1fr;min-width:0;min-height:0}
.topbar{display:flex;align-items:center;gap:6px;padding:8px 10px;border-bottom:1px solid var(--line);background:var(--panel)}
.tabs{display:flex;gap:2px;margin-left:6px}
.tab{height:30px;padding:0 12px;border:1px solid var(--line);border-bottom:0;border-radius:6px 6px 0 0;background:var(--surface);display:flex;align-items:center;gap:8px}
.tab[aria-selected=true]{background:var(--canvas);font-weight:600}
.tab.open{outline:2px dashed var(--strong);outline-offset:-2px}
.canvas{position:relative;overflow:hidden;background-color:var(--canvas);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:20px 20px}
.canvas.sdk:after{content:"SDK-owned Excalidraw canvas (unchanged)";position:absolute;left:24px;bottom:20px;font:11px var(--mono);color:var(--muted)}
/* empty state */
.empty{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none}
.empty-card{text-align:center;pointer-events:auto;max-width:520px}
.empty-hint{font-family:var(--hand);font-size:30px;line-height:1.25;color:var(--muted)}
.empty-sub{font-family:var(--hand);font-size:18px;color:var(--muted);margin-top:6px;opacity:.85}
.empty-actions{display:flex;gap:10px;justify-content:center;margin-top:22px}
.ghost{border:1px solid var(--strong);background:transparent;border-radius:8px;padding:8px 14px;display:flex;gap:10px;align-items:center}
.ghost kbd{font:11px var(--mono);color:var(--muted)}
.arrow{position:absolute;left:24px;top:14px;width:240px;height:110px;pointer-events:none}
.arrow path{fill:none;stroke:var(--muted);stroke-width:2;stroke-linecap:round}
.arrow text{font-family:var(--hand);font-size:17px;fill:var(--muted)}
/* menu */
.menu{position:absolute;z-index:6;min-width:220px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px;box-shadow:0 6px 18px rgba(0,0,0,.14)}
.menu button{display:flex;justify-content:space-between;width:100%;height:32px;align-items:center;border:0;background:transparent;border-radius:4px;padding:0 10px;font-size:14px;text-align:left}
.menu button:hover{background:var(--grid)}
.menu button.new{box-shadow:inset 3px 0 0 var(--focus)}
.menu button.danger{color:#8a2b2b}.dark .menu button.danger{color:#ff9b9b}
.menu hr{border:0;border-top:1px solid var(--line);margin:6px 2px}
/* toast */
.toast{position:absolute;left:50%;bottom:24px;transform:translateX(-50%);z-index:9;background:var(--ink);color:var(--panel);border-radius:8px;padding:8px 14px;font-size:13px;display:flex;gap:8px;align-items:center;box-shadow:0 4px 14px rgba(0,0,0,.2)}
.toast.err{background:var(--panel);color:var(--ink);border:1px solid #8a2b2b}
/* dialog */
.scrim{position:absolute;inset:0;background:var(--scrim);z-index:7}
.dialog{position:absolute;z-index:8;left:50%;top:44%;transform:translate(-50%,-50%);width:440px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:24px;box-shadow:0 12px 32px rgba(0,0,0,.2)}
.dialog h2{margin:0;font-size:18px;line-height:1.3}
.dialog p{margin:8px 0 0;color:var(--muted)}
.field{margin-top:18px}
.field label{display:block;font-size:12px;font-weight:600;margin-bottom:6px}
.inputrow{display:flex;align-items:center;border:1px solid var(--strong);border-radius:8px;background:var(--surface);height:38px;padding:0 10px}
.inputrow.focus{outline:2px solid var(--focus);outline-offset:1px}
.inputrow input{flex:1;border:0;background:transparent;font:14px var(--font);color:var(--ink);outline:none;min-width:0}
.inputrow .sel{background:rgba(111,63,181,.22)}
.suffix{color:var(--muted);font:13px var(--mono);padding-left:8px;border-left:1px solid var(--line);margin-left:8px}
.error{margin-top:8px;color:#8a2b2b;font-size:12px;display:flex;gap:6px}.dark .error{color:#ff9b9b}
.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:24px}
.btn{height:36px;padding:0 16px;border-radius:8px;border:1px solid var(--strong);background:var(--surface);font-size:14px}
.btn.primary{background:var(--ink);color:var(--panel);border-color:var(--ink)}
.btn.danger{background:#8a2b2b;color:#fff;border-color:#8a2b2b}
.btn.link{border-color:transparent;background:transparent;margin-right:auto;padding:0 6px;text-decoration:underline}
.path{font:12px var(--mono);background:var(--grid);padding:6px 8px;border-radius:6px;margin-top:10px;word-break:break-all}
.annot{position:absolute;z-index:10;right:14px;top:40px;width:300px;background:rgba(255,255,255,.96);color:#20201f;border:1px solid #969691;padding:10px;font-size:11px;box-shadow:3px 3px 0 rgba(0,0,0,.08)}
.annot strong{display:block;font-size:12px;margin-bottom:4px}.annot ul{margin:4px 0 0;padding-left:16px}
.titles{padding:28px 32px;color:var(--ink)}.titles table{border-collapse:collapse;width:100%;font-size:13px}.titles td,.titles th{border:1px solid var(--line);padding:8px 10px;text-align:left}.titles th{background:var(--grid)}
</style>
</head>
<body>
<div class="page">
  <aside class="nav" aria-label="Review-only state navigator">
    <h1>006 Multi-window · Low-fi</h1>
    <p>REVIEW ONLY. Grayscale structure, not visual tokens. 1280×760 reference viewport.</p>
    <div id="nav"></div>
    <div class="note" id="notes"></div>
  </aside>
  <div id="stage"></div>
</div>
<script>
const S=[
 ['Empty state (US5)',[['empty-light','Workspace, no drawing · Light'],['empty-dark','Workspace, no drawing · Dark'],['empty-zh','Workspace, no drawing · 简体中文']]],
 ['Copy path (US7)',[['menu-drawing','Sidebar ⋮ · drawing'],['menu-folder','Sidebar ⋮ · folder'],['menu-root','Sidebar ⋮ · workspace root'],['menu-tab','Tab context menu'],['toast-ok','Copied feedback'],['toast-err','Copy failed feedback']]],
 ['Dialogs (US6)',[['dlg-new-drawing','New drawing'],['dlg-new-folder','New folder'],['dlg-rename','Rename drawing'],['dlg-error','Naming error'],['dlg-delete','Delete confirmation'],['dlg-notempty','Folder not empty'],['dlg-remove-ws','Remove workspace']]],
 ['Multi-window (US1/US2)',[['nested-parent','Opening a parent of an open workspace'],['nested-child','Opening a folder inside an open workspace'],['titles','Window titles']]]
];
const NOTES={
 'empty-light':'<strong>Empty state</strong> Canvas-colored background + the canvas grid, so the area still reads as Excalidraw. Hand-drawn prompt and an arrow toward the Sidebar button. Two ghost actions with shortcut hints. No Excalidraw instance is mounted; pointer drawing does nothing. <br><br><strong>Decision points:</strong> arrow on/off when Sidebar is pinned (hidden here when pinned); grid density.',
 'empty-dark':'Dark uses the SDK dark canvas color (not pure black) and a dim grid.',
 'empty-zh':'Copy is localized; the hand-drawn face uses the bundled CJK hand-drawn font.',
 'menu-drawing':'<strong>Order</strong> [Rename] · [Copy Path, Copy Relative Path] · ─ · [Delete]. New items are marked with a left bar (review only). Existing SDK dropdown metrics are reused.',
 'menu-folder':'[New drawing, New folder] · [Copy Path, Copy Relative Path] · [Rename] · ─ · [Delete].',
 'menu-root':'Workspace root has <code>Copy Path</code> only (relative path would be empty).',
 'menu-tab':'Tab menu: [Close group] · ─ · [Copy Path, Copy Relative Path]. A drawing outside the workspace shows Copy Path only; an unsaved drawing shows neither.',
 'toast-ok':'<strong>Feedback</strong> Short, non-blocking toast at bottom center, ~2 s, <code>aria-live=polite</code>. Shows the copied text truncated in the middle so the user can verify.',
 'toast-err':'Failure toast stays until dismissed or 6 s; clipboard is not partially written.',
 'dlg-new-drawing':'<strong>Naming anatomy (extends DSC-DIALOG-001)</strong><ul><li>Title only; no redundant description for create.</li><li>Label above a full-width input; fixed <code>.excalidraw</code> suffix sits inside the same field box.</li><li>Default name selected.</li><li>Actions right-aligned: Cancel (secondary) then primary; 8px gap, 36px height.</li><li>Enter submits, Escape cancels.</li></ul>',
 'dlg-new-folder':'Same anatomy, no suffix.',
 'dlg-rename':'Rename prefills the current base name, selected.',
 'dlg-error':'Error renders under the field (role=alert); input keeps the typed value and focus.',
 'dlg-delete':'<strong>Confirmation anatomy</strong> Title states the action and object; description states consequence; the entry path is shown; destructive primary uses danger style; Cancel receives initial focus.',
 'dlg-notempty':'Same confirmation anatomy for the non-empty folder case.',
 'dlg-remove-ws':'Remove workspace is not destructive to files; primary is neutral, not danger.',
 'nested-parent':'<strong>US2 / FR-010</strong> Parent path contains a workspace open in another window. Three choices; default focus on “Switch to that window”. “Close it and open here” only proceeds after that window closes successfully.',
 'nested-child':'<strong>US2 / FR-009</strong> No dialog. The owning window is activated, the Sidebar opens (Overlay if hidden), the folder is expanded and selected, and a brief toast explains why. <br><br><strong>Decision point:</strong> keep or drop the toast.',
 'titles':'<strong>FR-007</strong> Proposed title format; final wording in hi-fi. Title text lives in the native title bar (OS-controlled, ADR-009 unchanged).'
};
const tl=(t,dark)=>`<div class="titlebar"><span class="lights"><i></i><i></i><i></i></span>${t}<span class="os">native title bar</span></div>`;
const tree=(o={})=>{const rows=[['ws','My Drawings',0,'root'],['dir','product',1,'folder'],['f','roadmap.excalidraw',2,'drawing'],['f','My-excalidraw-app-design.excalidraw',2,'drawing'],['dir','sub',1,'folder'],['f','flows.excalidraw',2,'drawing']];return `<aside class="sidebar"><div class="side-head"><button class="icon" aria-label="Toggle sidebar">▥</button><span class="ws">My Drawings</span><button class="icon" aria-label="New drawing">＋</button></div><div class="tree">${rows.map(r=>`<div class="row ${o.open===r[1]?'open':''} ${o.located===r[1]?'located':''}" style="--d:${r[2]}"><span>${r[0]==='dir'?'▾ 📁':r[0]==='ws'?'▾':'  ✎'}</span><span class="name">${r[1]}</span><button class="kebab" aria-label="More actions for ${r[1]}">⋮</button></div>`).join('')}</div></aside>`};
const top=(tabs)=>`<div class="topbar"><button class="icon" aria-label="Toggle sidebar">▥</button><button class="icon" aria-label="Back">←</button>${tabs?`<div class="tabs" role="tablist">${tabs}</div>`:''}</div>`;
const tabs=(o={})=>`<div class="tab ${o.open?'open':''}" role="tab" aria-selected="true">roadmap.excalidraw <span>×</span></div><div class="tab" role="tab" aria-selected="false">notes.excalidraw <span>×</span></div>`;
const menu=(items,x,y)=>`<div class="menu" role="menu" style="left:${x}px;top:${y}px">${items.map(i=>i==='-'?'<hr>':`<button role="menuitem" class="${i[1]||''}">${i[0]}</button>`).join('')}</div>`;
const win=(title,inner,dark)=>`<div class="win ${dark?'dark':''}">${tl(title)}<div class="body">${inner}</div></div>`;
function emptyState(zh){const t=zh?['从左侧选择一个绘图','或者新建一个，开始画吧','新建绘图','打开侧栏','绘图都在这里']:['Pick a drawing from the sidebar','or start a new one','New drawing','Show sidebar','Your drawings live here'];
 return `<section class="main">${top('')}<div class="canvas" aria-label="${zh?'空白画布区域':'Empty canvas area'}"><svg class="arrow" viewBox="0 0 240 110" aria-hidden="true"><path d="M150 92 C 110 88, 60 70, 22 14"/><path d="M22 14 L 20 34 M22 14 L 40 22"/><text x="120" y="108">${t[4]}</text></svg><div class="empty"><div class="empty-card"><div class="empty-hint">${t[0]}</div><div class="empty-sub">${t[1]}</div><div class="empty-actions"><button class="ghost">${t[2]} <kbd>⌘ N</kbd></button><button class="ghost">${t[3]} <kbd>⌘ \\</kbd></button></div></div></div></div></section>`}
function dialog(kind){
 const d={
 'dlg-new-drawing':['New drawing','','Untitled','.excalidraw','Create','primary'],
 'dlg-new-folder':['New folder','','Untitled Folder','','Create','primary'],
 'dlg-rename':['Rename drawing','','My-excalidraw-app-design','.excalidraw','Rename','primary'],
 'dlg-error':['Rename drawing','','roadmap','.excalidraw','Rename','primary','A drawing named “roadmap.excalidraw” already exists in this folder.'],
 }[kind];
 if(d)return `<div class="scrim"></div><section class="dialog" role="dialog" aria-modal="true" aria-labelledby="dt"><h2 id="dt">${d[0]}</h2><div class="field"><label for="nm">Name</label><div class="inputrow focus"><input id="nm" value="" aria-describedby="sx"><span class="sel" style="position:absolute;opacity:0"></span><span class="nmv"><span class="sel">${d[2]}</span></span>${d[3]?`<span class="suffix" id="sx" aria-label="Fixed extension ${d[3]}">${d[3]}</span>`:''}</div>${d[6]?`<div class="error" role="alert">⚠ ${d[6]}</div>`:''}</div><div class="actions"><button class="btn">Cancel</button><button class="btn ${d[5]}">${d[4]}</button></div></section>`;
 const c={
 'dlg-delete':['Delete “roadmap.excalidraw”?','The drawing and all of its version history will be removed. This can’t be undone.','~/My Drawings/product/roadmap.excalidraw','Delete','danger'],
 'dlg-notempty':['Delete folder “product”?','This folder contains 2 drawings. They and their version history will be removed.','~/My Drawings/product','Delete folder','danger'],
 'dlg-remove-ws':['Remove “My Drawings” from this window?','Files on disk are not changed. You can open it again from Recent.','~/My Drawings','Remove','primary'],
 'nested-parent':['“Documents” contains an open workspace','“My Drawings” is already open in another window. A workspace can’t be opened inside another one.','~/Documents  ⊃  ~/Documents/My Drawings','Switch to that window','primary'],
 }[kind];
 const extra=kind==='nested-parent'?'<button class="btn link">Close it and open here</button>':'';
 return `<div class="scrim"></div><section class="dialog" role="dialog" aria-modal="true" aria-labelledby="dt"><h2 id="dt">${c[0]}</h2><p>${c[1]}</p><div class="path">${c[2]}</div><div class="actions">${extra}<button class="btn" ${kind==='nested-parent'?'':'autofocus'}>Cancel</button><button class="btn ${c[4]}">${c[3]}</button></div></section>`;
}
function render(id){
 let h='';
 const title='roadmap.excalidraw — My Drawings';
 const dark=id==='empty-dark';
 if(id.startsWith('empty'))h=win('My Drawings',tree()+emptyState(id==='empty-zh'),dark);
 else if(id==='menu-drawing')h=win(title,tree({open:'roadmap.excalidraw'})+`<section class="main">${top(tabs())}<div class="canvas sdk"></div></section>`+menu([['Rename'],'-',['Copy Path','new'],['Copy Relative Path','new'],'-',['Delete','danger']],270,120));
 else if(id==='menu-folder')h=win(title,tree({open:'product'})+`<section class="main">${top(tabs())}<div class="canvas sdk"></div></section>`+menu([['New drawing'],['New folder'],'-',['Copy Path','new'],['Copy Relative Path','new'],'-',['Rename'],'-',['Delete','danger']],270,92));
 else if(id==='menu-root')h=win(title,tree({open:'My Drawings'})+`<section class="main">${top(tabs())}<div class="canvas sdk"></div></section>`+menu([['New drawing'],['New folder'],'-',['Copy Path','new'],'-',['Remove workspace']],270,64));
 else if(id==='menu-tab')h=win(title,tree()+`<section class="main">${top(tabs({open:true}))}<div class="canvas sdk"></div></section>`+menu([['Close'],['Close Others'],['Close to the Right'],['Close All'],'-',['Copy Path','new'],['Copy Relative Path','new']],420,80));
 else if(id==='toast-ok')h=win(title,tree()+`<section class="main">${top(tabs())}<div class="canvas sdk"></div></section><div class="toast" role="status">✓ Copied relative path · <span style="font-family:var(--mono)">product/roadmap.excalidraw</span></div>`);
 else if(id==='toast-err')h=win(title,tree()+`<section class="main">${top(tabs())}<div class="canvas sdk"></div></section><div class="toast err" role="alert">⚠ Couldn’t copy the path. Try again. <button class="btn" style="height:26px;padding:0 8px">Dismiss</button></div>`);
 else if(id.startsWith('dlg')||id==='nested-parent')h=win(id==='nested-parent'?'Untitled — Excalidraw':title,tree()+`<section class="main">${top(tabs())}<div class="canvas sdk"></div></section>`+dialog(id));
 else if(id==='nested-child')h=win('My Drawings',tree({located:'sub'})+emptyState(false)+`<div class="toast" role="status">“sub” is inside My Drawings, which is open in this window.</div>`);
 else if(id==='titles')h=win('roadmap.excalidraw — My Drawings',`<div class="titles" style="grid-column:1/-1"><h2 style="margin-top:0">Proposed window titles (FR-007)</h2><table><tr><th>Window state</th><th>Title</th></tr><tr><td>Welcome (no workspace, no drawing)</td><td>Excalidraw</td></tr><tr><td>Welcome with a drawing outside any workspace</td><td>notes.excalidraw — Excalidraw</td></tr><tr><td>Workspace, no drawing open</td><td>My Drawings</td></tr><tr><td>Workspace, active drawing</td><td>roadmap.excalidraw — My Drawings</td></tr><tr><td>Unsaved new drawing</td><td>Untitled — My Drawings</td></tr></table><p style="color:var(--muted)">Two workspaces with the same folder name: append the parent folder, e.g. “My Drawings (work)”. Window menu and Dock menu show these titles.</p></div>`);
 document.getElementById('stage').innerHTML=h;
 document.getElementById('notes').innerHTML=NOTES[id]||'';
 document.querySelectorAll('#nav button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.s===id)));
 try{history.replaceState(null,'','#'+id)}catch(e){}
}
document.getElementById('nav').innerHTML=S.map(([g,items])=>`<h2>${g}</h2>${items.map(([k,l])=>`<button data-s="${k}">${l}</button>`).join('')}`).join('');
document.getElementById('nav').addEventListener('click',e=>{const s=e.target.closest('button')?.dataset.s;if(s)render(s)});
render((location.hash||'#empty-light').slice(1));
</script>
</body>
</html>
