name: Release bundles

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      tag:
        description: Existing v* tag to build and publish
        required: true
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.event_name == 'workflow_call' && inputs.tag || github.ref }}
  cancel-in-progress: true

jobs:
  macos-universal:
    name: macOS Universal Binary
    # The project permanently distributes unsigned, unnotarized open-source
    # bundles through GitHub Releases (SC-010).
    runs-on: macos-14
    steps:
      - name: Check out the tagged source
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install locked frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Add macOS toolchain targets for the universal build
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Build the universal application bundle
        run: pnpm tauri build --target universal-apple-darwin

      - name: Upload macOS bundles
        uses: actions/upload-artifact@v7
        with:
          name: excalidraw-desktop-macos-universal
          path: |
            src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
            src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app.tar.gz
          if-no-files-found: error
          retention-days: 30

  linux-bundles:
    name: Linux AppImage / deb / rpm
    runs-on: ubuntu-22.04
    steps:
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            rpm

      - name: Check out the tagged source
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install locked frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Linux packages
        run: pnpm tauri build --bundles deb,rpm,appimage

      - name: Upload Linux bundles
        uses: actions/upload-artifact@v7
        with:
          name: excalidraw-desktop-linux
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm
            src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error
          retention-days: 30

  publish-github-release:
    name: Publish unsigned open-source release
    if: github.event_name == 'workflow_call' || startsWith(github.ref, 'refs/tags/v')
    needs: [macos-universal, linux-bundles]
    runs-on: ubuntu-22.04
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ github.event_name == 'workflow_call' && inputs.tag || github.ref_name }}
    steps:
      - name: Check out the tagged source
        uses: actions/checkout@v7

      - name: Download built bundles
        uses: actions/download-artifact@v8
        with:
          pattern: excalidraw-desktop-*
          path: release-assets

      - name: Compose release notes from CHANGELOG.md
        run: python3 scripts/changelog-release-notes.py "$RELEASE_TAG" > /tmp/release-notes.md

      - name: Create the GitHub release
        run: >-
          gh release create "$RELEASE_TAG"
          --repo "$GITHUB_REPOSITORY"
          --title "$RELEASE_TAG"
          --notes-file /tmp/release-notes.md

      - name: Upload all release assets
        shell: bash
        run: |
          while IFS= read -r -d '' asset; do
            gh release upload "$RELEASE_TAG" "$asset" --repo "$GITHUB_REPOSITORY"
          done < <(find release-assets -type f -print0)
